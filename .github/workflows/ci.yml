name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Prevent stale runs from consuming runner time when a branch is updated.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system checks
        working-directory: pyggie
        run: python manage.py check

      - name: Check migration consistency
        working-directory: pyggie
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        working-directory: pyggie
        run: python manage.py test home --verbosity 2
